# Local Postgres for development: `docker compose up -d`, then `pnpm db:setup`.
# The pgvector image is used now so adding embeddings later needs no change here.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
